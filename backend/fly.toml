app = "vibesift-api"
primary_region = "sin" # Singapore — ganti kalau mau region lain

[build]

[env]
  PORT = "8080"
  DATABASE_URL = "sqlite+aiosqlite:////data/vibesift.db"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 1

  [[http_service.checks]]
    interval = "15s"
    timeout = "5s"
    grace_period = "10s"
    method = "GET"
    path = "/api/health"

[[vm]]
  memory = "512mb"
  cpu_kind = "shared"
  cpus = 1

[mounts]
  source = "vibesift_data"
  destination = "/data"

# Catatan: release_command dilepas karena mesin release tidak mendapat volume.
# Jalankan migrasi manual via: fly ssh console -a vibesift-api -C "alembic upgrade head"
